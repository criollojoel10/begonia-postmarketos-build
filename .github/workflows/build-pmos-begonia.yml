name: Build postmarketOS for xiaomi-begonia

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "Interfaz: phosh, console, weston, plasma-mobile"
        required: true
        default: "phosh"
        type: choice
        options:
          - phosh
          - console
          - weston
          - plasma-mobile
      fde:
        description: "Activar Full Disk Encryption"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      extra_space:
        description: "Espacio extra en MB para la imagen rootfs"
        required: true
        default: "2048"
      pmaports_branch:
        description: "Rama pmaports"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - master

jobs:
  build:
    name: Build pmOS xiaomi-begonia
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      PMB_WORK: /home/runner/.local/var/pmbootstrap
      PMB_CONFIG: /home/runner/.config/pmbootstrap_v3.cfg
      PMAPORTS_DIR: /home/runner/work/begonia-postmarketos-build/begonia-postmarketos-build/pmaports

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -eux
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-venv \
            python3-setuptools \
            python3-wheel \
            build-essential \
            bison \
            flex \
            bc \
            cpio \
            zip \
            unzip \
            xz-utils \
            zstd \
            kmod \
            file \
            rsync \
            android-sdk-platform-tools \
            qemu-user-static \
            binfmt-support \
            ca-certificates \
            openssl \
            kpartx \
            util-linux \
            parted \
            e2fsprogs \
            dosfstools \
            findutils \
            coreutils

      - name: Clone pmbootstrap
        run: |
          set -eux
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p "$HOME/.local/bin"
          ln -sf "$PWD/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone pmaports with fallback
        run: |
          set -eux

          BRANCH="${{ github.event.inputs.pmaports_branch }}"

          if git clone --depth=1 --branch="$BRANCH" https://gitlab.postmarketos.org/postmarketOS/pmaports.git "$PMAPORTS_DIR"; then
            echo "Cloned pmaports branch: $BRANCH"
          else
            echo "Primary branch failed, trying fallback branches..."
            rm -rf "$PMAPORTS_DIR"

            if [ "$BRANCH" = "main" ]; then
              FALLBACK="master"
            else
              FALLBACK="main"
            fi

            git clone --depth=1 --branch="$FALLBACK" https://gitlab.postmarketos.org/postmarketOS/pmaports.git "$PMAPORTS_DIR"
            echo "Cloned fallback pmaports branch: $FALLBACK"
          fi

          git -C "$PMAPORTS_DIR" log -1 --oneline
          git -C "$PMAPORTS_DIR" branch --show-current || true

          # pmbootstrap needs origin/main ref for channels.cfg
          git -C "$PMAPORTS_DIR" update-ref refs/remotes/origin/main HEAD

      - name: Inspect begonia port before build
        run: |
          set -eux
          mkdir -p artifacts/preflight

          echo "=== Buscar device-xiaomi-begonia ==="
          find "$PMAPORTS_DIR/device" -maxdepth 4 -iname "*begonia*" -print | tee artifacts/preflight/begonia-files.txt

          echo "=== Buscar linux-postmarketos-mediatek-mt6785 ==="
          find "$PMAPORTS_DIR/device" "$PMAPORTS_DIR/main" -maxdepth 6 -iname "*mt6785*" -print | tee artifacts/preflight/mt6785-files.txt || true

          echo "=== Copiar archivos relevantes si existen ==="
          while read -r path; do
            if [ -f "$path" ]; then
              REL="${path#$PMAPORTS_DIR/}"
              mkdir -p "artifacts/preflight/$(dirname "$REL")"
              cp -av "$path" "artifacts/preflight/$REL" || true
            fi
          done < artifacts/preflight/begonia-files.txt

          echo "=== Grep device/package names ==="
          grep -rE "device-xiaomi-begonia|linux-postmarketos-mediatek-mt6785|firmware-xiaomi-begonia" "$PMAPORTS_DIR" \
            > artifacts/preflight/grep-begonia.txt 2>&1 || true

      - name: Prepare pmbootstrap config
        run: |
          set -eux

          UI="${{ github.event.inputs.ui }}"
          EXTRA="${{ github.event.inputs.extra_space }}"

          # CRITICAL: Clean work folder to avoid migration errors between runs
          rm -rf "$PMB_WORK"

          mkdir -p "$HOME/.config"

          # Write config FIRST, then let pmbootstrap create the work folder
          cat > "$PMB_CONFIG" <<EOF
          [pmbootstrap]
          aports = $PMAPORTS_DIR
          work = $PMB_WORK
          device = xiaomi-begonia
          ui = $UI
          user = joel
          extra_space = $EXTRA
          ssh_keys = False
          sudo_timer = False

          [mirrors]

          [providers]

          [build_options]
          cross = True
          EOF

          sed -i 's/^          //' "$PMB_CONFIG"

          echo "=== pmbootstrap version ==="
          pmbootstrap --version

          echo "=== pmbootstrap config ==="
          cat "$PMB_CONFIG"

          # Create work folder with version marker so pmbootstrap doesn't choke
          mkdir -p "$PMB_WORK/cache_git"
          echo "8" > "$PMB_WORK/version"

          # Symlink so pmbootstrap finds pmaports there
          ln -sfn "$PMAPORTS_DIR" "$PMB_WORK/cache_git/pmaports"

          echo "=== pmbootstrap status ==="
          pmbootstrap \
            -c "$PMB_CONFIG" \
            -p "$PMAPORTS_DIR" \
            -w "$PMB_WORK" \
            -t 3600 \
            --details-to-stdout \
            status || true

      - name: Build postmarketOS image
        run: |
          set -eux

          EXTRA="${{ github.event.inputs.extra_space }}"
          FDE="${{ github.event.inputs.fde }}"

          if [ "$FDE" = "true" ]; then
            printf '147147\n147147\n' | pmbootstrap \
              -c "$PMB_CONFIG" \
              -p "$PMAPORTS_DIR" \
              -w "$PMB_WORK" \
              -E "$EXTRA" \
              -t 3600 \
              --details-to-stdout \
              install --fde
          else
            printf '147147\n147147\n' | pmbootstrap \
              -c "$PMB_CONFIG" \
              -p "$PMAPORTS_DIR" \
              -w "$PMB_WORK" \
              -E "$EXTRA" \
              -t 3600 \
              --details-to-stdout \
              install
          fi

      - name: Export images
        run: |
          set -eux

          pmbootstrap \
            -c "$PMB_CONFIG" \
            -p "$PMAPORTS_DIR" \
            -w "$PMB_WORK" \
            -t 3600 \
            --details-to-stdout \
            export

          mkdir -p artifacts/export
          cp -av /tmp/postmarketOS-export/* artifacts/export/ || true

          echo "=== Exported artifacts ==="
          find artifacts/export -maxdepth 2 -type f -printf "%p %s bytes\n" | sort | tee artifacts/export/exported-files.txt

      - name: Validate exported images
        run: |
          set -eux

          echo "=== Validando que haya imágenes reales ==="
          find artifacts/export -type f -printf "%p %s bytes\n" | sort

          COUNT=$(find artifacts/export -type f \( -name "*.img" -o -name "*boot*" -o -name "*rootfs*" -o -name "*.zip" \) | wc -l)
          echo "image-like-files=$COUNT"

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No se exportaron imágenes. Revisar logs."
            exit 1
          fi

      - name: Generate checksums
        if: always()
        run: |
          set +e
          mkdir -p artifacts
          find artifacts -type f -not -name "SHA256SUMS.txt" -print0 | xargs -0 sha256sum > artifacts/SHA256SUMS.txt 2>/dev/null || true

      - name: Save debug logs
        if: always()
        run: |
          set +e
          mkdir -p artifacts/logs

          cp -av "$PMB_CONFIG" artifacts/logs/pmbootstrap_v3.cfg 2>/dev/null || true
          cp -av "$PMB_WORK/log.txt" artifacts/logs/pmbootstrap-log.txt 2>/dev/null || true

          pmbootstrap \
            -c "$PMB_CONFIG" \
            -p "$PMAPORTS_DIR" \
            -w "$PMB_WORK" \
            status > artifacts/logs/pmbootstrap-status.txt 2>&1 || true

          df -h > artifacts/logs/df-h.txt 2>&1 || true
          mount > artifacts/logs/mount.txt 2>&1 || true
          env | sort > artifacts/logs/env.txt 2>&1 || true

          find "$PMB_WORK" -maxdepth 5 -type f -name "*.log" -exec cp -av {} artifacts/logs/ \; 2>/dev/null || true

      - name: Upload postmarketOS artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postmarketos-xiaomi-begonia-${{ github.event.inputs.ui }}-fde-${{ github.event.inputs.fde }}
          path: artifacts/
          retention-days: 14