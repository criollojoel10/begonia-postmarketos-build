name: Build postmarketOS for xiaomi-begonia

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "Interfaz: phosh, console, weston, plasma-mobile"
        required: true
        default: "phosh"
        type: choice
        options:
          - phosh
          - console
          - weston
          - plasma-mobile
      fde:
        description: "Activar Full Disk Encryption"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      extra_space:
        description: "Espacio extra en MB para la imagen rootfs"
        required: true
        default: "2048"
      branch:
        description: "Branch de postmarketOS/pmaports"
        required: true
        default: "master"
        type: choice
        options:
          - master

jobs:
  build:
    name: Build pmOS xiaomi-begonia
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      PMB_WORK: /home/runner/.local/var/pmbootstrap
      PMB_CONFIG: /home/runner/.config/pmbootstrap_v3.cfg
      PMAPORTS: /home/runner/work/begonia-postmarketos-build/begonia-postmarketos-build/pmaports

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -eux
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-venv \
            python3-setuptools \
            python3-wheel \
            build-essential \
            bison \
            flex \
            bc \
            cpio \
            zip \
            unzip \
            xz-utils \
            zstd \
            kmod \
            file \
            rsync \
            android-sdk-platform-tools \
            qemu-user-static \
            binfmt-support \
            ca-certificates \
            openssl

      - name: Clone pmbootstrap
        run: |
          set -eux
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p "$HOME/.local/bin"
          ln -sf "$PWD/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone pmaports (master = edge channel)
        run: |
          set -eux
          git clone --depth=1 --branch=master https://gitlab.postmarketos.org/postmarketOS/pmaports.git pmaports
          echo "pmaports cloned to $PWD/pmaports"
          ls -la pmaports/

      - name: Show pmbootstrap version
        run: |
          set -eux
          pmbootstrap -c "$PMB_CONFIG" -p "$PMAPORTS" -w "$PMB_WORK" --version

      - name: Write pmbootstrap v3 config
        run: |
          set -eux

          mkdir -p "$(dirname $PMB_CONFIG)" "$PMB_WORK"
          UI="${{ github.event.inputs.ui }}"

          cat > "$PMB_CONFIG" << CFGEOF
          [pmbootstrap]
          aports = $PMAPORTS
          work = $PMB_WORK
          ui = $UI
          device = xiaomi-begonia
          user = joel
          extra_space = ${{ github.event.inputs.extra_space }}
          ssh_keys = False
          sudo_timer = False
          systemd = True

          [mirrors]

          [providers]

          [build_options]
          cross = True
          CFGEOF

          echo "=== Config written to $PMB_CONFIG ==="
          cat "$PMB_CONFIG"

      - name: Verify pmbootstrap can read config
        run: |
          set -eux
          pmbootstrap -c "$PMB_CONFIG" -p "$PMAPORTS" -w "$PMB_WORK" status

      - name: Build postmarketOS image
        run: |
          set -eux

          EXTRA="${{ github.event.inputs.extra_space }}"
          FDE="${{ github.event.inputs.fde }}"

          if [ "$FDE" = "true" ]; then
            pmbootstrap -c "$PMB_CONFIG" -p "$PMAPORTS" -w "$PMB_WORK" -E "$EXTRA" install --fde
          else
            pmbootstrap -c "$PMB_CONFIG" -p "$PMAPORTS" -w "$PMB_WORK" -E "$EXTRA" install
          fi

      - name: Export images
        run: |
          set -eux
          pmbootstrap -c "$PMB_CONFIG" -p "$PMAPORTS" -w "$PMB_WORK" export

          mkdir -p artifacts
          cp -av /tmp/postmarketOS-export/* artifacts/ || true

          echo "=== Artifacts ==="
          find artifacts -maxdepth 2 -type f -printf "%p %s bytes\n" | sort

      - name: Generate checksums
        run: |
          set -eux
          cd artifacts
          sha256sum * > SHA256SUMS.txt || true
          cd ..

      - name: Save pmbootstrap logs
        if: always()
        run: |
          set +e
          mkdir -p artifacts/logs
          cp -av "$PMB_WORK/log.txt" artifacts/logs/pmbootstrap-log.txt 2>/dev/null || true
          cp -av "$PMB_CONFIG" artifacts/logs/ 2>/dev/null || true
          pmbootstrap -c "$PMB_CONFIG" -p "$PMAPORTS" -w "$PMB_WORK" status > artifacts/logs/pmbootstrap-status.txt 2>&1 || true
          df -h > artifacts/logs/df-h.txt 2>&1 || true
          find "$PMB_WORK" -maxdepth 3 -type f -name "*.log" -exec cp -av {} artifacts/logs/ \; 2>/dev/null || true

      - name: Upload postmarketOS artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postmarketos-xiaomi-begonia-${{ github.event.inputs.ui }}-fde-${{ github.event.inputs.fde }}
          path: artifacts/
          retention-days: 14