name: Build pmOS begonia

on:
  workflow_dispatch:
    inputs:
      ui:
        description: UI
        required: true
        default: console
        type: choice
        options:
          - console
          - phosh
      fde:
        description: FDE
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      extra_space:
        description: Extra MB
        required: true
        default: "1024"
      cross:
        description: Cross
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      branch:
        description: pmaports branch
        required: true
        default: main
        type: choice
        options:
          - main
          - master

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PMB_WORK: /home/runner/.local/var/pmbootstrap
      PMB_CFG: /home/runner/.config/pmbootstrap_v3.cfg
      PORTS: /home/runner/work/begonia-postmarketos-build/begonia-postmarketos-build/pmaports

    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git python3 python3-pip python3-venv python3-setuptools build-essential bison flex bc cpio zip unzip xz-utils zstd kmod file rsync android-sdk-platform-tools qemu-user-static binfmt-support ca-certificates openssl kpartx util-linux parted e2fsprogs dosfstools

      - name: Clone pmbootstrap
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p $HOME/.local/bin
          ln -sf $PWD/pmbootstrap/pmbootstrap.py $HOME/.local/bin/pmbootstrap
          echo $HOME/.local/bin >> $GITHUB_PATH

      - name: pmaports
        run: |
          BR=${{ github.event.inputs.branch }}
          if git clone --depth=1 --branch=$BR https://gitlab.postmarketos.org/postmarketOS/pmaports.git $PORTS; then
            echo "OK: $BR"
          else
            rm -rf $PORTS
            git clone --depth=1 --branch=master https://gitlab.postmarketos.org/postmarketOS/pmaports.git $PORTS
          fi
          git -C $PORTS update-ref refs/remotes/origin/main HEAD

      - name: Config
        run: |
          rm -rf $PMB_WORK
          mkdir -p $HOME/.config
          C=${{ github.event.inputs.cross }}
          if [ "$C" = "true" ]; then X="True"; else X="False"; fi
          printf "[pmbootstrap]
aports = $PORTS
work = $PMB_WORK
device = xiaomi-begonia
ui = ${{ github.event.inputs.ui }}
user = joel
extra_space = ${{ github.event.inputs.extra_space }}
ssh_keys = False
sudo_timer = False

[build_options]
cross = $X
" > $PMB_CFG
          mkdir -p $PMB_WORK/cache_git
          echo "8" > $PMB_WORK/version
          ln -sfn $PORTS $PMB_WORK/cache_git/pmaports
          pmbootstrap -c $PMB_CFG -p $PORTS -w $PMB_WORK -t 3600 --details-to-stdout status

      - name: Build
        run: |
          FLAGS="-c $PMB_CFG -p $PORTS -w $PMB_WORK -E ${{ github.event.inputs.extra_space }} -t 3600 -j 2 --details-to-stdout"
          if [ "${{ github.event.inputs.cross }}" = "false" ]; then FLAGS="$FLAGS --no-cross"; fi
          printf '147147
147147
' | pmbootstrap $FLAGS install

      - name: Export
        run: |
          pmbootstrap -c $PMB_CFG -p $PORTS -w $PMB_WORK -t 3600 --details-to-stdout export
          mkdir -p artifacts/export
          cp -av /tmp/postmarketOS-export/* artifacts/export/ || true
          find artifacts/export -type f -printf "%p %s bytes\n" | sort | tee artifacts/export/files.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmos-${{ github.event.inputs.ui }}
          path: artifacts/
          retention-days: 14