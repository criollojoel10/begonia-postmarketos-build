name: Build pmOS begonia

on:
  workflow_dispatch:
    inputs:
      ui:
        description: UI
        required: true
        default: console
        type: choice
        options:
          - console
          - phosh      
      extra:
        description: Extra MB
        required: true
        default: "1024"
      cross:
        description: Cross
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      branch:
        description: Branch
        required: true
        default: main
        type: choice
        options:
          - main
          - master

jobs:
  b:
    runs-on: ubuntu-latest
    env:
      W: /home/runner/.local/var/pmbootstrap
      C: /home/runner/.config/pmbootstrap_v3.cfg
      P: /home/runner/work/begonia-postmarketos-build/begonia-postmarketos-build/pmaports
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p $HOME/.local/bin
          ln -sf $PWD/pmbootstrap/pmbootstrap.py $HOME/.local/bin/pmbootstrap
          echo $HOME/.local/bin >> $GITHUB_PATH
      - run: |
          if git clone --depth=1 --branch=${{ github.event.inputs.branch }} https://gitlab.postmarketos.org/postmarketOS/pmaports.git $P; then echo ok; fi
          git -C $P update-ref refs/remotes/origin/main HEAD
      - run: |
          rm -rf $W
          mkdir -p $HOME/.config
          X=False
          if [ "${{ github.event.inputs.cross }}" = "true" ]; then X=True; fi
          printf '[pmbootstrap]\naports = %s\nwork = %s\ndevice = xiaomi-begonia\nui = %s\nuser = joel\nextra_space = %s\nssh_keys = False\nsudo_timer = False\n\n[build_options]\ncross = %s\n' "$P" "$W" "${{ github.event.inputs.ui }}" "${{ github.event.inputs.extra }}" "$X" > $C
          mkdir -p $W/cache_git
          echo "8" > $W/version
          ln -sfn $P $W/cache_git/pmaports
      - run: echo done